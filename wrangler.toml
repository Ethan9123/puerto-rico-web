# Cloudflare 配置：Workers + 静态资源（Static Assets）
# `wrangler deploy` 把 directory 下的文件作为静态资源上传；worker/index.js 处理
# /collect、/dump、/stats 三个 API，其余路径回退到静态资源（env.ASSETS）。
# 非网页文件由同目录的 .assetsignore 排除（含 worker/ 源码本身）。
name = "puerto-rico-web"
compatibility_date = "2026-06-16"
main = "worker/index.js"

# ── 自定义域名 ───────────────────────────────────────────────────────────
# puerto-rico.try-board-game.uk 指向本 Worker（含联机；邀请链接用 location.origin 自动跟随）。
# 前提：try-board-game.uk 已作为 zone 托管在同一 Cloudflare 账号下（已确认）。
# 注意：custom_domain 只在【生产部署】生效（推到生产分支，通常是 main）；分支预览仍走
# *.workers.dev 预览域。Cloudflare 会自动建 DNS 记录并签发证书（HTTPS）。
routes = [
  { pattern = "puerto-rico.try-board-game.uk", custom_domain = true }
]

[assets]
directory = "."
binding = "ASSETS"

# ── 训练数据收集（真人对局）后端 ─────────────────────────────────────────
# 已启用：绑定 KV 命名空间 PR_TRACES，/collect 入库、/dump 取回、/stats 统计。
# 取回受保护：设置 Secret DUMP_TOKEN 后，/dump、/stats 需 ?token= 才能访问
#   （控制台 Workers → Settings → Variables and Secrets，或 `wrangler secret put DUMP_TOKEN`）。
[[kv_namespaces]]
binding = "PR_TRACES"
id = "3da4d4a9bae449d88f7aa1cf4a477aee"
