<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>波多黎各 Puerto Rico</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div id="setup-screen" class="screen">
    <h1>波多黎各 Puerto Rico</h1>
    <p class="subtitle">基于 Tony Mitton 的进化器规则 + Rio Grande 原版规则书</p>
    <div class="setup-box">
      <label>玩家数量：
        <select id="player-count">
          <option value="1">1 人（单人闯关·刷分）</option>
          <option value="2">2 人（官方双人变体）</option>
          <option value="3">3 人局</option>
          <option value="4" selected>4 人局</option>
          <option value="5">5 人局</option>
        </select>
      </label>
      <label>你的名字：<input id="player-name" value="玩家" maxlength="10"></label>
      <div id="mode-note" class="mode-note hidden"></div>
      <div id="cpu-levels"></div>
      <div class="quick-set">
        <span>快速设定：</span>
        <button type="button" class="qs-btn" data-set="all1">全部入门</button>
        <button type="button" class="qs-btn" data-set="all3">全部普通</button>
        <button type="button" class="qs-btn" data-set="all5">全部专家</button>
        <button type="button" class="qs-btn" data-set="all6">全部宗师</button>
        <button type="button" class="qs-btn" data-set="mixed" title="每点一次，随机生成一种难度组合（如 L1/L6/L2）">🎲 混合难度</button>
      </div>
      <label><input type="checkbox" id="all-ai"> 全部 AI 对战（看 AI 互打）</label>
      <label><input type="checkbox" id="live-cast" checked> 🎙️ 实况解说台（激情解说你和 AI 的每一手）</label>
      <fieldset id="module-select" class="module-select">
        <legend>🏛️ 扩展模块（可任意组合，单独或叠加）</legend>
        <div class="module-presets">
          <span>预设：</span>
          <button type="button" class="qs-btn" data-mods="none">基础</button>
          <button type="button" class="qs-btn" data-mods="official">官方(新建筑+贵族)</button>
          <button type="button" class="qs-btn" data-mods="all">全开(含Tibs)</button>
        </div>
        <label title="14 个新建筑(24-37)，启用建筑轮抽"><input type="checkbox" id="mod-newbuildings"> 新建筑扩展（14 建筑）</label>
        <label title="贵族棋子机制 + 8 个贵族建筑(38-45)。建议同时勾「新建筑」（官方扩展 1+2 常合卖）"><input type="checkbox" id="mod-nobles"> 贵族扩展（贵族棋子 + 8 建筑）</label>
        <label title="Tibs 同人 8 建筑(46-53)。寄宿屋取代济贫院"><input type="checkbox" id="mod-tibs"> Tibs 自制建筑（8 建筑）</label>
        <label title="开局随机 3 个竞速目标（种植/生产/建造），完全独立"><input type="checkbox" id="mod-festival"> 节庆模块（竞速目标）</label>
        <label title="第 8 个角色「海盗」，仅人类可选（AI 跳过，避免影响 AI 强度）"><input type="checkbox" id="mod-buccaneer"> 🏴‍☠️ 海盗角色（仅人类）</label>
      </fieldset>
      <label>AI 思考时间（L5/L6）：
        <select id="ai-think-budget">
          <option value="fast">快速（0.1s · 看 AI 互打）</option>
          <option value="normal">普通（1.5s）</option>
          <option value="deep" selected>深度（6s · 2轮 lookahead）</option>
          <option value="extreme">极限（10s · 推荐 PvAI）</option>
        </select>
      </label>
      <button id="btn-start">开始游戏</button>
      <div class="tutorial-entry">
        <span>📖 新手教程：</span>
        <button type="button" class="tut-btn" data-tour="base">基础玩法</button>
        <button type="button" class="tut-btn" data-tour="newbuildings">新建筑扩展</button>
        <button type="button" class="tut-btn" data-tour="nobles">贵族扩展</button>
        <button type="button" class="tut-btn" data-tour="tibs">Tibs 扩展</button>
      </div>
    </div>
    <div class="rules-link">
      <details>
        <summary>查看游戏规则</summary>
        <div id="rules-text"></div>
      </details>
    </div>
    <div class="lang-links">
      🌐 <a href="https://github.com/Ethan9123/puerto-rico-web/blob/main/README.md" target="_blank" rel="noopener">中文</a>
      · <a href="https://github.com/Ethan9123/puerto-rico-web/blob/main/README.en.md" target="_blank" rel="noopener">English</a>
      · <a href="https://github.com/Ethan9123/puerto-rico-web/blob/main/README.fr.md" target="_blank" rel="noopener">Français</a>
      · <a href="https://github.com/Ethan9123/puerto-rico-web/blob/main/README.es.md" target="_blank" rel="noopener">Español</a>
    </div>
  </div>

  <div id="game-screen" class="screen hidden">
    <header id="topbar">
      <div id="game-info"></div>
      <div id="action-bar"></div>
      <div id="resources-info"></div>
      <button id="btn-show-rules" class="small">规则</button>
      <button id="btn-tutorial-ingame" class="small">教程</button>
      <button id="btn-restart" class="small">重开</button>
    </header>

    <section id="roles-area">
      <div id="roles"></div>
    </section>

    <section id="market-area">
      <div id="plantations-row" class="board-row">
        <h3>种植园池</h3>
        <div id="plantations-pool"></div>
      </div>
      <div id="buildings-row" class="board-row">
        <h3>建筑市场</h3>
        <div id="buildings-pool"></div>
      </div>
      <div id="ships-row" class="board-row">
        <h3>船只 / 贸易站</h3>
        <div id="ships"></div>
      </div>
    </section>

    <section id="players-area"></section>

    <div id="log-panel">
      <h4>事件日志</h4>
      <div id="log"></div>
    </div>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-bg"></div>
    <div class="modal-box">
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
      <div id="modal-buttons"></div>
    </div>
  </div>
</div>

<div id="toast-stack"></div>
<div id="commentary-box" class="hidden"></div>

<script src="ai_dna_data.js"></script>
<script src="ai_dna.js"></script>
<script src="game.js"></script>
<script src="sim.js"></script>
<script src="sim_features.js"></script>
<script src="sim_nn.js"></script>
<script src="sim_solve.js"></script>
<script src="trace.js"></script>
<script src="tutorial.js"></script>
<script src="net.js"></script>
<script src="lobby.js"></script>
</body>
</html>
